seed: 42
num_classes: 2
lr: 0.001
batch_size: 4
user:
  username: jiribuchta
logger:
  _target_: rationai.mlkit.lightning.loggers.mlflow.MLFlowLogger
  experiment_name: example_provenance_train
  tracking_uri: sqlite:////tmp/mlflow_ex.db
  run_name: null
trainer:
  accelerator: cpu
  max_epochs: 2
  log_every_n_steps: 5
  callbacks:
  - _target_: rationai.mlkit.lightning.callbacks.ProvenanceCallback
    model_name: example_simple_net
    fail_fast: false
